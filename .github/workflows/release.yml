name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0); 仅手动触发时生效"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install NSIS
        # CI 环境预装 makensis，供 build.ps1 第 6 步编译 Setup.exe 使用。
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # choco 不会把 NSIS 加入 PATH，这里显式加入，供 build.ps1 通过 Get-Command makensis 找到
          echo "C:\Program Files (x86)\NSIS" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $v = '${{ inputs.version }}'
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Package
        shell: pwsh
        run: ./package-release.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Enforce public release policy
        shell: pwsh
        run: ./scripts/Test-ReleasePolicy.ps1 -RequirePublicReleaseApproval

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeepSeekHarness-Desktop-*.zip
            dist/DeepSeekHarness-Setup-*.exe
