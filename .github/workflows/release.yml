name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0); 仅手动触发时生效"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $v = '${{ inputs.version }}'
          }
          ./package-release.ps1 -Version $v

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeepSeekHarness-Desktop-*.zip
