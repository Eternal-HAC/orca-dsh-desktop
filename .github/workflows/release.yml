name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Package
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v',''
          ./package-release.ps1 -Version $v

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeepSeekHarness-Desktop-*.zip
